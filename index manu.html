<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comidinhas da Manu</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #fff7f0 0%, #fff3e8 40%, #fde8d8 100%);
      font-family: 'Nunito', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* Leaf decorations */
    body::before {
      content: '🌿';
      position: fixed;
      top: -10px;
      left: -10px;
      font-size: 120px;
      opacity: 0.12;
      transform: rotate(-20deg);
      pointer-events: none;
    }
    body::after {
      content: '🌿';
      position: fixed;
      bottom: -10px;
      right: -10px;
      font-size: 120px;
      opacity: 0.12;
      transform: rotate(160deg);
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Avatar */
    .avatar-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .avatar-wrap img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 4px 20px rgba(230, 90, 30, 0.18);
      display: block;
    }

    .name {
      font-family: 'Pacifico', cursive;
      font-size: 1.55rem;
      color: #e85c1a;
      text-align: center;
      line-height: 1.2;
      margin-bottom: 2px;
    }

    .subtitle {
      font-size: 0.85rem;
      font-weight: 700;
      color: #4a7c59;
      text-align: center;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 0.82rem;
      color: #9e6e4a;
      text-align: center;
      font-style: italic;
      margin-bottom: 28px;
    }

    /* Divider */
    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #e85c1a, #f7b731);
      border-radius: 99px;
      margin-bottom: 28px;
    }

    /* Buttons */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 22px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 800;
      font-size: 1rem;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      cursor: pointer;
      border: none;
      outline: none;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.13);
    }

    .btn:active {
      transform: translateY(0px);
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .btn-label {
      font-size: 0.72rem;
      font-weight: 600;
      opacity: 0.7;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .btn-title {
      font-size: 0.97rem;
      font-weight: 800;
    }

    /* WhatsApp */
    .btn-whatsapp {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: #fff;
      box-shadow: 0 4px 18px rgba(37, 211, 102, 0.3);
    }
    .btn-whatsapp .btn-icon { background: rgba(255,255,255,0.2); }

    /* Instagram */
    .btn-instagram {
      background: linear-gradient(135deg, #f9a825 0%, #e85c1a 45%, #c2185b 100%);
      color: #fff;
      box-shadow: 0 4px 18px rgba(232, 92, 26, 0.28);
    }
    .btn-instagram .btn-icon { background: rgba(255,255,255,0.2); }

    /* Cardápio */
    .btn-cardapio {
      background: #fff;
      color: #e85c1a;
      border: 2.5px solid #e85c1a;
      box-shadow: 0 4px 14px rgba(232, 92, 26, 0.10);
    }
    .btn-cardapio .btn-icon { background: #fff7f0; }
    .btn-cardapio .btn-label { color: #c0522a; }

    /* Encomenda */
    .btn-encomenda {
      background: linear-gradient(135deg, #fff3e8 0%, #fde8d8 100%);
      color: #4a7c59;
      border: 2.5px solid #4a7c59;
      box-shadow: 0 4px 14px rgba(74, 124, 89, 0.10);
    }
    .btn-encomenda .btn-icon { background: #eaf4ec; }
    .btn-encomenda .btn-label { color: #4a7c59; }

    /* Footer */
    .footer {
      margin-top: 40px;
      font-size: 0.75rem;
      color: #c0a090;
      text-align: center;
    }
    .footer span { color: #e85c1a; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar-wrap">
      <!-- Logo da Manu como avatar -->
      <img src="https://i.imgur.com/placeholder.png" alt="Comidinhas da Manu"
           onerror="this.style.background='#fff7f0';this.style.display='flex';this.style.alignItems='center';this.style.justifyContent='center';this.innerHTML='🍽️';"
           id="logo-img" />
    </div>

    <h1 class="name">Comidinhas da Manu</h1>
    <p class="subtitle">Personal Home Chef</p>

    <div class="divider"></div>

      </a>

      <!-- Instagram -->
      <a class="btn btn-instagram"
         href="https://www.instagram.com/comidinhas.da.manu_"
         target="_blank" rel="noopener">

        </div>
        <div class="btn-text">
          <span class="btn-label">Me siga</span>
          <span class="btn-title">Instagram @comidinhas.da.manu_</span>
        </div>
      </a>

      <!-- Cardápio -->
      <a class="btn btn-cardapio"
         href="https://wa.me/5511968022504?text=Ol%C3%A1%20Manu!%20Quero%20ver%20o%20card%C3%A1pio%20%F0%9F%8D%BD%EF%B8%8F"
         target="_blank" rel="noopener">
        <div class="btn-icon" style="font-size:1.4rem;">🍽️</div>
        <div class="btn-text">
          <span class="btn-label">Confira</span>
          <span class="btn-title">Ver Cardápio</span>
        </div>
      </a>

      <!-- Encomenda -->
      <a class="btn btn-encomenda"
         href="https://wa.me/5511968022504?text=Ol%C3%A1%20Manu!%20Quero%20fazer%20uma%20encomenda%20%F0%9F%8D3"
         target="_blank" rel="noopener">
        <div class="btn-icon" style="font-size:1.4rem;">📦</div>
        <div class="btn-text">
          <span class="btn-label">Solicitar</span>
          <span class="btn-title">Fazer Encomenda</span>
        </div>
      </a>

    </div>

    <div class="footer">
      Feito com <span>♥</span> para a Manu · Nutrição & Sabor
    </div>
  </div>

  <script>
    // Tenta carregar o logo da Manu como avatar
    const img = document.getElementById('logo-img');
    // Como não temos a imagem hospedada, usa um emoji fallback elegante
    img.onerror = function() {
      this.outerHTML = `<div style="
        width:110px;height:110px;border-radius:50%;
        background:linear-gradient(135deg,#fff7f0,#fde8d8);
        border:4px solid #fff;
        box-shadow:0 4px 20px rgba(230,90,30,0.18);
        display:flex;align-items:center;justify-content:center;
        font-size:3rem;
      ">🍃</div>`;
    };
    img.src = img.src; // trigger onerror if needed
  </script>
</body>
</html>
